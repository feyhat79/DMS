        const base64ToBytes = (b64) => {
            const binary = window.atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        };

        // Entschlüsselt den AES-256-GCM Payload mit Web Crypto API
        const decryptPayloadWithPassword = async (payload, password) => {
            const enc = new TextEncoder();
            const salt = base64ToBytes(payload.salt);
            const iv = base64ToBytes(payload.iv);
            const ciphertext = base64ToBytes(payload.data);

            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );

            const key = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: payload.iterations || 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            const decryptedBuffer = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                key,
                ciphertext
            );

            return new TextDecoder("utf-8").decode(decryptedBuffer);
        };

        // INTERAKTIVER FAMILIEN-GRAPH (auf Modulebene, damit Zoom-Updates die Komponente nicht neu mounten)
        const FamilyFocusGraph = ({
            personId,
            familyMap,
            getGenderStyle,
            getSiblingType,
            navigateToPersonInTree,
            treeZoom,
            setTreeZoom
        }) => {
            const [hoveredId, setHoveredId] = useState(null);

            const person = personId ? familyMap[personId] : null;
            if (!person) return null;

            const vater = familyMap[person.Vater_ID] || null;
            const mutter = familyMap[person.Mutter_ID] || null;
            const partners = person.Partner_ID
                ? person.Partner_ID.split(',').map(id => familyMap[id.trim()]).filter(Boolean)
                : [];
            const children = (person.children || []).map(id => familyMap[id]).filter(Boolean);
            const siblings = Object.values(familyMap).filter(p =>
                p.ID !== person.ID &&
                ((person.Vater_ID && p.Vater_ID === person.Vater_ID) || (person.Mutter_ID && p.Mutter_ID === person.Mutter_ID))
            );

            // Deterministisches, kreuzungsfreies Graph-Layout berechnen
            const layout = useMemo(() => {
                const REL_W = 166;
                const REL_H = 62;
                const HERO_W = 204;
                const HERO_H = 76;
                const PAD_X = 48;
                const PAD_Y = 44;

                const nodes = [];
                const edges = [];
                const hearts = [];
                const sectionLabels = [];

                const addNode = (p, roleLabel, category, cx, cy, extra = {}) => {
                    nodes.push({
                        id: `${category}-${p.ID}`,
                        person: p,
                        roleLabel,
                        category,
                        cx,
                        cy,
                        w: category === 'hero' ? HERO_W : REL_W,
                        h: category === 'hero' ? HERO_H : REL_H,
                        ...extra
                    });
                };

                // 1. FOKUSPERSON (Zentrum der mittleren Ebene)
                const heroCx = 0;
                const heroCy = 0;
                addNode(person, 'Im Fokus', 'hero', heroCx, heroCy);

                let midTop = -HERO_H / 2;
                let midBottom = HERO_H / 2;

                // 2. PARTNER (rechts neben der Fokusperson mit Herz-Kante)
                let childOriginX = heroCx;
                let childOriginY = HERO_H / 2;

                if (partners.length === 1) {
                    const partner = partners[0];
                    const gap = 92;
                    const partnerCx = heroCx + HERO_W / 2 + gap + REL_W / 2;
                    const partnerCy = heroCy;
                    const roleLabel = partner.Geschlecht === 'm' ? 'Ehemann' : partner.Geschlecht === 'w' ? 'Ehefrau' : 'Partner/in';
                    addNode(partner, roleLabel, 'partner', partnerCx, partnerCy);

                    const startX = heroCx + HERO_W / 2;
                    const endX = partnerCx - REL_W / 2;
                    const midX = (startX + endX) / 2;

                    edges.push({
                        id: `edge-partner-${partner.ID}`,
                        targetPersonId: partner.ID,
                        kind: 'partner',
                        d: `M ${startX} ${heroCy} L ${endX} ${partnerCy}`
                    });
                    hearts.push({ id: `heart-partner-${partner.ID}`, x: midX, y: heroCy });

                    // Kinder starten genau unter der gemeinsamen Herz-Verbindung
                    childOriginX = midX;
                    childOriginY = heroCy;
                } else if (partners.length > 1) {
                    const gapX = 96;
                    const stepY = REL_H + 16;
                    const partnerCx = heroCx + HERO_W / 2 + gapX + REL_W / 2;
                    const totalH = (partners.length - 1) * stepY;
                    const startY = heroCy - totalH / 2;

                    partners.forEach((partner, idx) => {
                        const py = startY + idx * stepY;
                        const roleLabel = partner.Geschlecht === 'm' ? 'Ehemann' : partner.Geschlecht === 'w' ? 'Ehefrau' : 'Partner/in';
                        addNode(partner, roleLabel, 'partner', partnerCx, py);
                        midTop = Math.min(midTop, py - REL_H / 2);
                        midBottom = Math.max(midBottom, py + REL_H / 2);

                        const x1 = heroCx + HERO_W / 2;
                        const x2 = partnerCx - REL_W / 2;
                        const cxCtrl = (x1 + x2) / 2;
                        edges.push({
                            id: `edge-partner-${partner.ID}`,
                            targetPersonId: partner.ID,
                            kind: 'partner',
                            d: `M ${x1} ${heroCy} C ${cxCtrl} ${heroCy}, ${cxCtrl} ${py}, ${x2} ${py}`
                        });
                        if (idx === 0) {
                            hearts.push({ id: `heart-partner-multi`, x: x1 + 26, y: (heroCy + py) / 2 });
                        }
                    });
                }

                // 3. GESCHWISTER (links neben der Fokusperson, bei >=3 in 2 Spalten mit freier Mittel-Schiene)
                let sibRailX = null;
                let sibTopTargetY = null;

                if (siblings.length > 0) {
                    const stepY = REL_H + 16;
                    if (siblings.length <= 2) {
                        const gap = 92;
                        const colCx = heroCx - HERO_W / 2 - gap - REL_W / 2;
                        sibRailX = (colCx + REL_W / 2 + (heroCx - HERO_W / 2)) / 2;
                        const totalH = (siblings.length - 1) * stepY;
                        const startY = heroCy - totalH / 2;
                        const busTop = startY - 34;
                        sibTopTargetY = busTop;
                        midTop = Math.min(midTop, startY - REL_H / 2);
                        midBottom = Math.max(midBottom, startY + totalH + REL_H / 2);

                        sectionLabels.push({
                            text: siblings.length === 1 ? 'Geschwister' : `Geschwister (${siblings.length})`,
                            x: colCx,
                            y: startY - REL_H / 2 - 14,
                            align: 'center'
                        });

                        siblings.forEach((sib, idx) => {
                            const sy = startY + idx * stepY;
                            const isHalf = getSiblingType(person.ID, sib.ID) === 'half';
                            let roleLabel = sib.Geschlecht === 'm' ? 'Bruder' : sib.Geschlecht === 'w' ? 'Schwester' : 'Geschwister';
                            if (isHalf) {
                                roleLabel = sib.Geschlecht === 'm' ? 'Halbbruder' : sib.Geschlecht === 'w' ? 'Halbschwester' : 'Halbgeschwister';
                            }
                            addNode(sib, roleLabel, 'sibling', colCx, sy, { isHalf });

                            const edgeStartX = colCx + REL_W / 2;
                            edges.push({
                                id: `edge-sib-${sib.ID}`,
                                targetPersonId: sib.ID,
                                kind: isHalf ? 'half-blood' : 'blood',
                                d: `M ${sibRailX} ${busTop} L ${sibRailX} ${sy} Q ${sibRailX} ${sy}, ${(sibRailX + edgeStartX) / 2} ${sy} L ${edgeStartX} ${sy}`
                            });
                        });
                    } else {
                        // Zweispaltiges Layout: Schiene verläuft exakt im freien 48px-Kanal zwischen Spalte 0 (links) & Spalte 1 (rechts)
                        const gapHero = 64;
                        const railChannel = 48;
                        const col1Cx = heroCx - HERO_W / 2 - gapHero - REL_W / 2;
                        const col0Cx = col1Cx - REL_W - railChannel;
                        sibRailX = (col0Cx + REL_W / 2 + (col1Cx - REL_W / 2)) / 2;

                        const rows = Math.ceil(siblings.length / 2);
                        const totalH = (rows - 1) * stepY;
                        const startY = heroCy - totalH / 2;
                        const busTop = startY - 34;
                        sibTopTargetY = busTop;
                        midTop = Math.min(midTop, startY - REL_H / 2);
                        midBottom = Math.max(midBottom, startY + totalH + REL_H / 2);

                        sectionLabels.push({
                            text: `Geschwister (${siblings.length})`,
                            x: sibRailX,
                            y: startY - REL_H / 2 - 14,
                            align: 'center'
                        });

                        siblings.forEach((sib, idx) => {
                            const rowIdx = Math.floor(idx / 2);
                            const isRightCol = idx % 2 === 1;
                            const sx = isRightCol ? col1Cx : col0Cx;
                            const sy = startY + rowIdx * stepY;
                            const isHalf = getSiblingType(person.ID, sib.ID) === 'half';
                            let roleLabel = sib.Geschlecht === 'm' ? 'Bruder' : sib.Geschlecht === 'w' ? 'Schwester' : 'Geschwister';
                            if (isHalf) {
                                roleLabel = sib.Geschlecht === 'm' ? 'Halbbruder' : sib.Geschlecht === 'w' ? 'Halbschwester' : 'Halbgeschwister';
                            }
                            addNode(sib, roleLabel, 'sibling', sx, sy, { isHalf });

                            const connectX = isRightCol ? (sx - REL_W / 2) : (sx + REL_W / 2);
                            edges.push({
                                id: `edge-sib-${sib.ID}`,
                                targetPersonId: sib.ID,
                                kind: isHalf ? 'half-blood' : 'blood',
                                d: `M ${sibRailX} ${busTop} L ${sibRailX} ${sy} L ${connectX} ${sy}`
                            });
                        });
                    }
                }

                // 4. ELTERN (obere Ebene, gekrönt über der Blutlinie)
                if (vater || mutter) {
                    const parentGap = 62;
                    const parentCy = midTop - 116 - REL_H / 2;
                    const parentCenterX = sibRailX !== null ? Math.max(-72, (heroCx + sibRailX) / 2) : heroCx;
                    const splitY = midTop - 42;

                    if (vater && mutter) {
                        const vaterCx = parentCenterX - REL_W / 2 - parentGap / 2;
                        const mutterCx = parentCenterX + REL_W / 2 + parentGap / 2;
                        addNode(vater, 'Vater', 'parent', vaterCx, parentCy);
                        addNode(mutter, 'Mutter', 'parent', mutterCx, parentCy);

                        sectionLabels.push({ text: 'Eltern', x: parentCenterX, y: parentCy - REL_H / 2 - 14, align: 'center' });

                        const vxRight = vaterCx + REL_W / 2;
                        const mxLeft = mutterCx - REL_W / 2;
                        edges.push({
                            id: 'edge-parents-union',
                            targetPersonId: vater.ID,
                            secondaryPersonId: mutter.ID,
                            kind: 'partner',
                            d: `M ${vxRight} ${parentCy} L ${mxLeft} ${parentCy}`
                        });
                        hearts.push({ id: 'heart-parents', x: parentCenterX, y: parentCy });

                        const originY = parentCy;
                        const heroTopY = heroCy - HERO_H / 2;
                        edges.push({
                            id: `edge-parent-hero`,
                            targetPersonId: vater.ID,
                            secondaryPersonId: mutter.ID,
                            kind: 'blood',
                            d: `M ${parentCenterX} ${originY + 12} L ${parentCenterX} ${splitY} C ${parentCenterX} ${(splitY + heroTopY) / 2}, ${heroCx} ${(splitY + heroTopY) / 2}, ${heroCx} ${heroTopY}`
                        });

                        if (sibRailX !== null) {
                            edges.push({
                                id: 'edge-parent-siblings',
                                targetPersonId: vater.ID,
                                secondaryPersonId: mutter.ID,
                                kind: 'blood',
                                d: `M ${parentCenterX} ${splitY} C ${parentCenterX} ${(splitY + sibTopTargetY) / 2}, ${sibRailX} ${(splitY + sibTopTargetY) / 2}, ${sibRailX} ${sibTopTargetY}`
                            });
                        }
                    } else {
                        const singleParent = vater || mutter;
                        const roleLabel = vater ? 'Vater' : 'Mutter';
                        addNode(singleParent, roleLabel, 'parent', parentCenterX, parentCy);
                        sectionLabels.push({ text: 'Elternteil', x: parentCenterX, y: parentCy - REL_H / 2 - 14, align: 'center' });

                        const originY = parentCy + REL_H / 2;
                        const heroTopY = heroCy - HERO_H / 2;
                        edges.push({
                            id: 'edge-single-parent-hero',
                            targetPersonId: singleParent.ID,
                            kind: 'blood',
                            d: `M ${parentCenterX} ${originY} L ${parentCenterX} ${splitY} C ${parentCenterX} ${(splitY + heroTopY) / 2}, ${heroCx} ${(splitY + heroTopY) / 2}, ${heroCx} ${heroTopY}`
                        });

                        if (sibRailX !== null) {
                            edges.push({
                                id: 'edge-single-parent-siblings',
                                targetPersonId: singleParent.ID,
                                kind: 'blood',
                                d: `M ${parentCenterX} ${splitY} C ${parentCenterX} ${(splitY + sibTopTargetY) / 2}, ${sibRailX} ${(splitY + sibTopTargetY) / 2}, ${sibRailX} ${sibTopTargetY}`
                            });
                        }
                    }
                } else if (sibRailX !== null) {
                    const bridgeY = midTop - 36;
                    const heroTopY = heroCy - HERO_H / 2;
                    edges.push({
                        id: 'edge-sib-bridge-hero',
                        targetPersonId: person.ID,
                        kind: 'blood',
                        d: `M ${sibRailX} ${sibTopTargetY} C ${sibRailX} ${bridgeY}, ${heroCx} ${bridgeY}, ${heroCx} ${heroTopY}`
                    });
                }

                // 5. KINDER (untere Ebene, bei <=5 in einer Reihe, bei >=6 in 4er-Reihen mit freier Mittelachse)
                if (children.length > 0) {
                    const row1Cy = midBottom + 106 + REL_H / 2;
                    const splitY = midBottom + 44;

                    if (children.length <= 5) {
                        const gapX = 20;
                        const totalW = children.length * REL_W + (children.length - 1) * gapX;
                        const startX = childOriginX - totalW / 2 + REL_W / 2;

                        sectionLabels.push({
                            text: children.length === 1 ? 'Kind' : `Kinder (${children.length})`,
                            x: childOriginX,
                            y: row1Cy + REL_H / 2 + 20,
                            align: 'center'
                        });

                        children.forEach((child, idx) => {
                            const cx = startX + idx * (REL_W + gapX);
                            const roleLabel = child.Geschlecht === 'm' ? 'Sohn' : child.Geschlecht === 'w' ? 'Tochter' : 'Kind';
                            addNode(child, roleLabel, 'child', cx, row1Cy);

                            const targetY = row1Cy - REL_H / 2;
                            const startY = childOriginY + (partners.length === 1 ? 12 : 0);
                            edges.push({
                                id: `edge-child-${child.ID}`,
                                targetPersonId: child.ID,
                                kind: 'blood',
                                d: `M ${childOriginX} ${startY} L ${childOriginX} ${splitY} C ${childOriginX} ${(splitY + targetY) / 2}, ${cx} ${(splitY + targetY) / 2}, ${cx} ${targetY}`
                            });
                        });
                    } else {
                        const centerSpineGap = 56;
                        const colGap = 18;
                        const rowGap = 38;
                        const stepRowY = REL_H + rowGap;

                        const rows = [];
                        for (let i = 0; i < children.length; i += 4) {
                            rows.push(children.slice(i, i + 4));
                        }

                        const startY = childOriginY + (partners.length === 1 ? 12 : 0);
                        const lastRowCy = row1Cy + (rows.length - 1) * stepRowY;
                        sectionLabels.push({
                            text: `Kinder (${children.length})`,
                            x: childOriginX,
                            y: lastRowCy + REL_H / 2 + 22,
                            align: 'center'
                        });

                        rows.forEach((rowItems, rowIdx) => {
                            const rCy = row1Cy + rowIdx * stepRowY;
                            const busY = rCy - REL_H / 2 - 20;

                            if (rowIdx === 0) {
                                edges.push({
                                    id: `edge-child-spine-0`,
                                    targetPersonId: person.ID,
                                    kind: 'blood',
                                    d: `M ${childOriginX} ${startY} L ${childOriginX} ${busY}`
                                });
                            } else {
                                const prevBusY = row1Cy + (rowIdx - 1) * stepRowY - REL_H / 2 - 20;
                                edges.push({
                                    id: `edge-child-spine-${rowIdx}`,
                                    targetPersonId: person.ID,
                                    kind: 'blood',
                                    d: `M ${childOriginX} ${prevBusY} L ${childOriginX} ${busY}`
                                });
                            }

                            let rowPositions = [];
                            if (rowItems.length === 1) {
                                rowPositions = [childOriginX];
                            } else if (rowItems.length === 2) {
                                const offset = centerSpineGap / 2 + REL_W / 2;
                                rowPositions = [childOriginX - offset, childOriginX + offset];
                            } else if (rowItems.length === 3) {
                                const inner = centerSpineGap / 2 + REL_W / 2;
                                const outer = inner + REL_W + colGap;
                                rowPositions = [childOriginX - outer, childOriginX - inner, childOriginX + inner];
                            } else {
                                const inner = centerSpineGap / 2 + REL_W / 2;
                                const outer = inner + REL_W + colGap;
                                rowPositions = [childOriginX - outer, childOriginX - inner, childOriginX + inner, childOriginX + outer];
                            }

                            rowItems.forEach((child, idxInRow) => {
                                const cx = rowPositions[idxInRow];
                                const roleLabel = child.Geschlecht === 'm' ? 'Sohn' : child.Geschlecht === 'w' ? 'Tochter' : 'Kind';
                                addNode(child, roleLabel, 'child', cx, rCy);

                                const topY = rCy - REL_H / 2;
                                edges.push({
                                    id: `edge-child-${child.ID}`,
                                    targetPersonId: child.ID,
                                    kind: 'blood',
                                    d: `M ${childOriginX} ${busY} L ${cx} ${busY} L ${cx} ${topY}`
                                });
                            });
                        });
                    }
                }

                // Normalisierung aller Koordinaten in positiven Canvas-Bereich
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                nodes.forEach(n => {
                    minX = Math.min(minX, n.cx - n.w / 2);
                    maxX = Math.max(maxX, n.cx + n.w / 2);
                    minY = Math.min(minY, n.cy - n.h / 2);
                    maxY = Math.max(maxY, n.cy + n.h / 2);
                });
                sectionLabels.forEach(l => {
                    minY = Math.min(minY, l.y - 12);
                    maxY = Math.max(maxY, l.y + 12);
                });

                const offsetX = PAD_X - minX;
                const offsetY = PAD_Y - minY;
                const width = Math.max(460, Math.ceil(maxX - minX + PAD_X * 2));
                const height = Math.max(300, Math.ceil(maxY - minY + PAD_Y * 2));

                return { nodes, edges, hearts, sectionLabels, offsetX, offsetY, width, height };
            }, [personId, familyMap]);

            const hasAnyRelation = vater || mutter || partners.length > 0 || children.length > 0 || siblings.length > 0;

            const categoryTheme = {
                parent: {
                    ring: 'hover:border-[#1B4D3E] hover:bg-[#F2F8F5]',
                    pill: 'bg-[#EDF5F1] text-[#1B4D3E]'
                },
                partner: {
                    ring: 'hover:border-[#C26A83] hover:bg-[#FDF5F7]',
                    pill: 'bg-[#FBF1F4] text-[#9E4B63]'
                },
                child: {
                    ring: 'hover:border-[#3A7591] hover:bg-[#F2F7FA]',
                    pill: 'bg-[#EEF5F8] text-[#2F6680]'
                },
                sibling: {
                    ring: 'hover:border-[#B57B24] hover:bg-[#FDF9EF]',
                    pill: 'bg-[#FBF5E8] text-[#9A6416]'
                }
            };

            return (
                <div className="bg-white rounded-[28px] border border-stone-200/90 shadow-[0_8px_30px_-10px_rgba(23,32,28,0.08)] overflow-hidden animate-fade-in">
                    {/* KOPFZEILE / STATUSZEILE */}
                    <div className="bg-[#FAF8F4] border-b border-stone-200/80 px-5 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs text-stone-600">
                        <div>
                            <strong className="text-[#15211D]">Familien-Graph von {person.Name}:</strong>{' '}
                            Klicke auf eine verbundene Person, um sie direkt in den Fokus zu holen.
                        </div>
                        <ZoomControls treeZoom={treeZoom} setTreeZoom={setTreeZoom} />
                    </div>

                    {/* GRAPH-LEINWAND */}
                    <div className="atlas-grid overflow-auto custom-scrollbar min-h-[400px] max-h-[72vh] p-4 sm:p-6">
                        <div
                            className="mx-auto relative shrink-0"
                            style={{
                                width: `${layout.width * treeZoom}px`,
                                height: `${layout.height * treeZoom}px`
                            }}
                        >
                            <div
                                className="relative origin-top-left"
                                style={{
                                    width: `${layout.width}px`,
                                    height: `${layout.height}px`,
                                    transform: `scale(${treeZoom})`
                                }}
                            >
                                {/* SVG-KANTEN */}
                                <svg
                                    width={layout.width}
                                    height={layout.height}
                                    viewBox={`0 0 ${layout.width} ${layout.height}`}
                                    className="absolute inset-0 pointer-events-none"
                                >
                                    <g transform={`translate(${layout.offsetX}, ${layout.offsetY})`}>
                                        {layout.edges.map(edge => {
                                            const isActive =
                                                hoveredId &&
                                                (edge.targetPersonId === hoveredId || edge.secondaryPersonId === hoveredId);
                                            const isPartner = edge.kind === 'partner';
                                            const isHalf = edge.kind === 'half-blood';

                                            let stroke = '#B9C4BE';
                                            if (isPartner) stroke = isActive ? '#9E4B63' : '#D98EA3';
                                            else if (isHalf) stroke = isActive ? '#B57B24' : '#D5BB8E';
                                            else if (isActive) stroke = '#1B4D3E';

                                            return (
                                                <path
                                                    key={edge.id}
                                                    d={edge.d}
                                                    fill="none"
                                                    stroke={stroke}
                                                    strokeWidth={isActive ? 2.6 : 1.8}
                                                    strokeDasharray={isPartner ? '6 5' : isHalf ? '4 4' : undefined}
                                                    strokeLinecap="round"
                                                    strokeLinejoin="round"
                                                    style={{ transition: 'stroke 150ms ease, stroke-width 150ms ease' }}
                                                />
                                            );
                                        })}
                                    </g>
                                </svg>

                                {/* SEKTIONSLABELS IM GRAPHEN */}
                                {layout.sectionLabels.map((lbl, i) => (
                                    <div
                                        key={i}
                                        style={{
                                            left: `${lbl.x + layout.offsetX}px`,
                                            top: `${lbl.y + layout.offsetY}px`,
                                            transform: 'translate(-50%, -50%)'
                                        }}
                                        className="absolute pointer-events-none text-[10px] font-bold uppercase tracking-[0.12em] text-stone-400 whitespace-nowrap"
                                    >
                                        {lbl.text}
                                    </div>
                                ))}

                                {/* HERZ-MEDAILLONS AUF PARTNER-VERBINDUNGEN */}
                                {layout.hearts.map(h => (
                                    <div
                                        key={h.id}
                                        style={{
                                            left: `${h.x + layout.offsetX}px`,
                                            top: `${h.y + layout.offsetY}px`,
                                            transform: 'translate(-50%, -50%)'
                                        }}
                                        className="absolute w-7 h-7 rounded-full bg-white border border-[#EAC5D0] text-[#B85873] shadow-sm flex items-center justify-center pointer-events-none"
                                    >
                                        <Icon name="Heart" size={12} />
                                    </div>
                                ))}

                                {/* PERSONEN-KNOTEN */}
                                {layout.nodes.map(node => {
                                    const left = node.cx + layout.offsetX - node.w / 2;
                                    const top = node.cy + layout.offsetY - node.h / 2;
                                    const gStyle = getGenderStyle(node.person.Geschlecht);

                                    if (node.category === 'hero') {
                                        return (
                                            <div
                                                key={node.id}
                                                style={{ left: `${left}px`, top: `${top}px`, width: `${node.w}px`, height: `${node.h}px` }}
                                                className="absolute rounded-2xl bg-[#102B22] text-white border-2 border-[#C78C33] shadow-[0_14px_30px_-10px_rgba(16,43,34,0.45)] px-4 flex flex-col justify-center"
                                            >
                                                <div className="flex items-center justify-between gap-2 mb-0.5">
                                                    <span className="text-[10px] font-bold uppercase tracking-[0.12em] text-[#E6B86A]">
                                                        Im Fokus
                                                    </span>
                                                    <span className={`w-2 h-2 rounded-full ${gStyle.dot} ring-2 ring-white/25`}></span>
                                                </div>
                                                <div className="font-serif text-lg font-bold tracking-tight truncate leading-tight">
                                                    {node.person.Name}
                                                </div>
                                            </div>
                                        );
                                    }

                                    const theme = categoryTheme[node.category] || categoryTheme.parent;
                                    return (
                                        <button
                                            key={node.id}
                                            type="button"
                                            onClick={() => navigateToPersonInTree(node.person)}
                                            onMouseEnter={() => setHoveredId(node.person.ID)}
                                            onMouseLeave={() => setHoveredId(null)}
                                            style={{ left: `${left}px`, top: `${top}px`, width: `${node.w}px`, height: `${node.h}px` }}
                                            className={`absolute rounded-2xl bg-white border border-stone-200/90 shadow-[0_4px_14px_-6px_rgba(23,32,28,0.12)] hover:shadow-md hover:-translate-y-0.5 transition-all cursor-pointer px-3.5 py-2 flex flex-col justify-center text-left group ${theme.ring}`}
                                        >
                                            <div className="flex items-center justify-between gap-2 mb-1">
                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full truncate ${theme.pill}`}>
                                                    {node.roleLabel}
                                                </span>
                                                <span className={`w-2 h-2 rounded-full shrink-0 ${gStyle.dot}`}></span>
                                            </div>
                                            <div className="font-semibold text-[13.5px] text-[#15211D] group-hover:text-[#102B22] truncate leading-snug">
                                                {node.person.Name}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {!hasAnyRelation && (
                            <p className="text-center text-xs text-stone-400 italic mt-2">
                                Keine direkten Beziehungen (Eltern, Partner, Kinder oder Geschwister) hinterlegt.
                            </p>
                        )}
                    </div>

                    {/* DEZENTE LEGENDE */}
                    <div className="bg-[#FAF8F4] border-t border-stone-200/80 px-5 py-2 flex flex-wrap items-center justify-between gap-3 text-[11px] text-stone-500">
                        <div className="flex flex-wrap items-center gap-4">
                            <span className="inline-flex items-center gap-1.5">
                                <span className="w-5 h-0.5 bg-[#9AA8A0] rounded-full"></span>
                                Blutlinie
                            </span>
                            <span className="inline-flex items-center gap-1.5">
                                <span className="w-5 border-t-2 border-dashed border-[#D98EA3]"></span>
                                Partner
                            </span>
                            {siblings.some(s => getSiblingType(person.ID, s.ID) === 'half') && (
                                <span className="inline-flex items-center gap-1.5">
                                    <span className="w-5 border-t-2 border-dashed border-[#D5BB8E]"></span>
                                    Halbgeschwister
                                </span>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('calculator');
            const [familyMap, setFamilyMap] = useState({});
            const [showModal, setShowModal] = useState(true);

            // Passwort-Sperrbildschirm States
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [showPassword, setShowPassword] = useState(false);
            const [rememberMe, setRememberMe] = useState(true);
            const [authError, setAuthError] = useState("");
            const [isDecrypting, setIsDecrypting] = useState(false);

            // Globale Header-Schnellsuche
            const [globalSearchQuery, setGlobalSearchQuery] = useState("");
            const [globalSearchFocused, setGlobalSearchFocused] = useState(false);
            const globalSearchRef = useRef(null);

            // Rechner States
            const [relPersonA, setRelPersonA] = useState(null);
            const [relPersonB, setRelPersonB] = useState(null);
            const [relSearchA, setRelSearchA] = useState("");
            const [relSearchB, setRelSearchB] = useState("");
            const [selectedLineIdx, setSelectedLineIdx] = useState(0);

            // Baum-Ansicht States
            const [treeSearchQuery, setTreeSearchQuery] = useState("");
            const [focusPerson, setFocusPerson] = useState(null);
            const [focusHistory, setFocusHistory] = useState([]);
            const [viewMode, setViewMode] = useState('satellite');
            const [treeZoom, setTreeZoom] = useState(1);

            // Statistik States
            const [expandedName, setExpandedName] = useState(null);

            const loadDataFromCSVString = (csvString) => {
                try {
                    const workbook = XLSX.read(csvString, { type: 'string', FS: ";" });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { raw: false, FS: ";" });

                    const newFamilyMap = {};
                    jsonData.forEach(row => {
                        if (row.ID && row.Name) {
                            newFamilyMap[String(row.ID)] = {
                                ID: String(row.ID),
                                Name: String(row.Name).trim(),
                                Vater_ID: row.Vater_ID ? String(row.Vater_ID).trim() : "",
                                Mutter_ID: row.Mutter_ID ? String(row.Mutter_ID).trim() : "",
                                Partner_ID: row.Partner_ID ? String(row.Partner_ID).trim() : "",
                                Notiz: row.Notiz ? String(row.Notiz).trim() : "",
                                Geschlecht: row.Geschlecht ? String(row.Geschlecht).trim().toLowerCase() : "",
                                Generation: row.Generation ? String(row.Generation).trim() : "",
                                children: []
                            };
                        }
                    });

                    Object.values(newFamilyMap).forEach(p => {
                        const link = (pid) => {
                            if (pid && newFamilyMap[pid] && !newFamilyMap[pid].children.includes(p.ID)) {
                                newFamilyMap[pid].children.push(p.ID);
                            }
                        };
                        link(p.Vater_ID);
                        link(p.Mutter_ID);
                    });

                    setFamilyMap(newFamilyMap);
                } catch (e) {
                    console.error("Fehler beim Laden der CSV:", e);
                }
            };

            const attemptUnlock = async (pw, saveToStorage = false) => {
                if (!pw || !window.ENCRYPTED_PAYLOAD) return false;
                setIsDecrypting(true);
                setAuthError("");
                try {
                    const csvString = await decryptPayloadWithPassword(window.ENCRYPTED_PAYLOAD, pw);
                    loadDataFromCSVString(csvString);
                    setIsUnlocked(true);
                    if (saveToStorage) {
                        try { localStorage.setItem(STORAGE_KEY_PW, pw); } catch (e) {}
                    }
                    setIsDecrypting(false);
                    return true;
                } catch (err) {
                    setIsDecrypting(false);
                    setAuthError("Falsches Passwort. Bitte versuche es erneut.");
                    return false;
                }
            };

            useEffect(() => {
                try {
                    const savedPw = localStorage.getItem(STORAGE_KEY_PW);
                    if (savedPw && window.ENCRYPTED_PAYLOAD) {
                        attemptUnlock(savedPw, false).then((ok) => {
                            if (!ok) localStorage.removeItem(STORAGE_KEY_PW);
                        });
                    }
                } catch (e) {}
            }, []);

            // Tastaturkürzel '/' oder Cmd/Ctrl+K für schnelle Globale Suche
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!isUnlocked) return;
                    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
                    const isTyping = tag === 'input' || tag === 'textarea';
                    if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !isTyping)) {
                        e.preventDefault();
                        if (globalSearchRef.current) {
                            globalSearchRef.current.focus();
                        }
                    } else if (e.key === 'Escape') {
                        setGlobalSearchFocused(false);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isUnlocked]);

            // Bei Wechsel von Person A oder B immer wieder auf Hauptverbindung (Index 0) zurücksetzen
            useEffect(() => {
                setSelectedLineIdx(0);
            }, [relPersonA, relPersonB]);

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                if (!passwordInput.trim()) return;
                await attemptUnlock(passwordInput.trim(), rememberMe);
            };

            const handleLockSession = () => {
                try { localStorage.removeItem(STORAGE_KEY_PW); } catch (e) {}
                setFamilyMap({});
                setIsUnlocked(false);
                setPasswordInput("");
                setAuthError("");
                setRelPersonA(null);
                setRelPersonB(null);
                setFocusPerson(null);
                setFocusHistory([]);
                setGlobalSearchQuery("");
            };

            const navigateToPersonInTree = (personOrId, targetMode = null) => {
                const target = typeof personOrId === 'string' ? familyMap[personOrId] : personOrId;
                if (!target) return;
                if (focusPerson && focusPerson.ID !== target.ID) {
                    setFocusHistory(prev => {
                        const filtered = prev.filter(item => item.ID !== target.ID);
                        return [...filtered.slice(-8), focusPerson];
                    });
                }
                setFocusPerson(target);
                setTreeSearchQuery("");
                setGlobalSearchQuery("");
                setGlobalSearchFocused(false);
                if (targetMode) setViewMode(targetMode);
                if (activeTab !== 'tree') setActiveTab('tree');
            };

            const jumpToHistoryIndex = (idx) => {
                const target = focusHistory[idx];
                if (!target) return;
                setFocusHistory(prev => prev.slice(0, idx));
                setFocusPerson(target);
            };

            const handleTreeBack = () => {
                if (focusHistory.length === 0) return;
                const previous = focusHistory[focusHistory.length - 1];
                setFocusHistory(prev => prev.slice(0, -1));
                setFocusPerson(previous);
            };

            const normalizeText = (text) => {
                return text ? text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";
            };

            const searchPeople = (query) => {
                if (!query) return [];
                const normalizedQuery = normalizeText(query.trim());
                if (!normalizedQuery) return [];

                const matches = Object.values(familyMap).filter(p =>
                    normalizeText(p.Name).includes(normalizedQuery) || String(p.ID) === normalizedQuery
                );

                matches.sort((a, b) => {
                    const na = normalizeText(a.Name);
                    const nb = normalizeText(b.Name);
                    const aExact = na === normalizedQuery ? 0 : na.startsWith(normalizedQuery) ? 1 : 2;
                    const bExact = nb === normalizedQuery ? 0 : nb.startsWith(normalizedQuery) ? 1 : 2;
                    if (aExact !== bExact) return aExact - bExact;
                    return (b.children?.length || 0) - (a.children?.length || 0);
                });

                return matches.slice(0, 12);
            };

            const getPersonDetails = (person) => {
                if (!person) return { parentsText: "", partnerText: "", childrenCount: 0, partners: [] };
                const vater = familyMap[person.Vater_ID];
                const mutter = familyMap[person.Mutter_ID];
                let parentsText = "";
                if (vater && mutter) parentsText = `Eltern: ${vater.Name} & ${mutter.Name}`;
                else if (vater) parentsText = `Vater: ${vater.Name}`;
                else if (mutter) parentsText = `Mutter: ${mutter.Name}`;

                const partners = person.Partner_ID
                    ? person.Partner_ID.split(',').map(id => familyMap[id.trim()]).filter(Boolean)
                    : [];
                const partnerText = partners.length > 0 ? `Partner: ${partners.map(p => p.Name).join(', ')}` : "";
                const childrenCount = person.children ? person.children.length : 0;

                return { parentsText, partnerText, childrenCount, partners };
            };

            const getPersonContext = (person) => {
                const { parentsText, partnerText, childrenCount } = getPersonDetails(person);
                const parts = [];
                if (parentsText) parts.push(parentsText);
                if (partnerText) parts.push(partnerText);
                if (childrenCount > 0) parts.push(`${childrenCount} ${childrenCount === 1 ? 'Kind' : 'Kinder'}`);
                return parts.length > 0 ? parts.join(' • ') : "Stammbaum-Eintrag";
            };

            const getRelevantPartner = (currentId, childId) => {
                if (!currentId) return null;
                const current = familyMap[currentId];
                if (!current) return null;

                if (childId) {
                    const child = familyMap[childId];
                    if (child) {
                        const p1 = child.Vater_ID;
                        const p2 = child.Mutter_ID;
                        if (p1 === currentId && p2) return familyMap[p2];
                        if (p2 === currentId && p1) return familyMap[p1];
                    }
                }

                if (current.Partner_ID) {
                    const firstPartnerId = current.Partner_ID.split(',')[0].trim();
                    return familyMap[firstPartnerId];
                }
                return null;
            };

            // Prüft ob zwei Personen Vollgeschwister (beide Eltern gleich) oder Halbgeschwister (nur 1 Elternteil gleich) sind
            const getSiblingType = (id1, id2) => {
                const p1 = familyMap[id1]; const p2 = familyMap[id2];
                if (!p1 || !p2 || id1 === id2) return null;
                const sameFather = Boolean(p1.Vater_ID && p2.Vater_ID && p1.Vater_ID === p2.Vater_ID);
                const sameMother = Boolean(p1.Mutter_ID && p2.Mutter_ID && p1.Mutter_ID === p2.Mutter_ID);
                if (!sameFather && !sameMother) return null;

                const diffMother = p1.Mutter_ID && p2.Mutter_ID && p1.Mutter_ID !== p2.Mutter_ID;
                const diffFather = p1.Vater_ID && p2.Vater_ID && p1.Vater_ID !== p2.Vater_ID;
                if ((sameFather && diffMother) || (sameMother && diffFather)) {
                    return "half";
                }
                return "full";
            };

            const getTerm = (dSelf, dOther, gender, isHalfSibling = false) => {
                if (dSelf === 0) {
                    if (dOther === 1) return gender === 'm' ? 'Vater' : gender === 'w' ? 'Mutter' : 'Elternteil';
                    if (dOther === 2) return gender === 'm' ? 'Großvater' : gender === 'w' ? 'Großmutter' : 'Großelternteil';
                    if (dOther === 3) return gender === 'm' ? 'Urgroßvater' : gender === 'w' ? 'Urgroßmutter' : 'Urgroßelternteil';
                    return gender === 'm' ? `${dOther-2}x Ur-Großvater` : gender === 'w' ? `${dOther-2}x Ur-Großmutter` : `${dOther-2}x Ur-Großelternteil`;
                }
                if (dOther === 0) {
                    if (dSelf === 1) return gender === 'm' ? 'Sohn' : gender === 'w' ? 'Tochter' : 'Kind';
                    if (dSelf === 2) return gender === 'm' ? 'Enkel' : gender === 'w' ? 'Enkelin' : 'Enkelkind';
                    if (dSelf === 3) return gender === 'm' ? 'Urenkel' : gender === 'w' ? 'Urenkelin' : 'Urenkelkind';
                    return gender === 'm' ? `${dSelf-2}x Ur-Enkel` : gender === 'w' ? `${dSelf-2}x Ur-Enkelin` : `${dSelf-2}x Ur-Enkelkind`;
                }
                if (dSelf === 1 && dOther === 1) {
                    if (isHalfSibling) return gender === 'm' ? 'Halbbruder' : gender === 'w' ? 'Halbschwester' : 'Halbgeschwister';
                    return gender === 'm' ? 'Bruder' : gender === 'w' ? 'Schwester' : 'Geschwister';
                }
                if (dSelf === 1) {
                    if (dOther === 2) return gender === 'm' ? 'Onkel' : gender === 'w' ? 'Tante' : 'Onkel/Tante';
                    if (dOther === 3) return gender === 'm' ? 'Großonkel' : gender === 'w' ? 'Großtante' : 'Großonkel/-tante';
                    return gender === 'm' ? `${dOther-3}x Ur-Großonkel` : gender === 'w' ? `${dOther-3}x Ur-Großtante` : `${dOther-3}x Ur-Großonkel/-tante`;
                }
                if (dOther === 1) {
                    if (dSelf === 2) return gender === 'm' ? 'Neffe' : gender === 'w' ? 'Nichte' : 'Neffe/Nichte';
                    if (dSelf === 3) return gender === 'm' ? 'Großneffe' : gender === 'w' ? 'Großnichte' : 'Großneffe/-nichte';
                    return gender === 'm' ? `${dSelf-3}x Ur-Großneffe` : gender === 'w' ? `${dSelf-3}x Ur-Großnichte` : `${dSelf-3}x Ur-Großneffe/-nichte`;
                }
                return "";
            };

            const toGenitiv = (name) => /[sßzx]$/i.test(name) ? `${name}’` : `${name}s`;

            const getDirectedRoleBtoA = (dA, dB, genB, isHalf = false) => {
                if (dA === 0 && dB === 0) return "Identische Person";
                const termB = getTerm(dB, dA, genB, isHalf);
                if (termB) return termB;
                const minDist = Math.min(dA, dB);
                const diff = Math.abs(dA - dB);
                if (minDist >= 2) {
                    const deg = minDist - 1;
                    const base = genB === 'm' ? `Cousin ${deg}. Grades` : genB === 'w' ? `Cousine ${deg}. Grades` : `Cousin/e ${deg}. Grades`;
                    if (diff === 0) return base;
                    return `${base} (${diff} Gen. ${dB < dA ? 'älter' : 'jünger'})`;
                }
                return "Verwandt";
            };

            const getRelationText = (dA, dB, genA, genB, isHalf = false, pathA = [], pathB = []) => {
                if (dA === 0 && dB === 0) return { main: "Identisch", sub: "Dieselbe Person", roleBtoA: "Identisch" };
                const diff = Math.abs(dA - dB); const minDist = Math.min(dA, dB);
                const roleBtoA = getDirectedRoleBtoA(dA, dB, genB, isHalf);

                if (minDist === 0) {
                    const termA = getTerm(dA, dB, genA); const termB = getTerm(dB, dA, genB);
                    const subText = diff === 1 ? "Direkte Linie (1 Generation)" : `Direkte Linie (${diff} Generationen)`;
                    return dA < dB
                        ? { main: `${termA} & ${termB}`, sub: subText, roleBtoA }
                        : { main: `${termB} & ${termA}`, sub: subText, roleBtoA };
                }

                if (minDist === 1) {
                    const termA = getTerm(dA, dB, genA, isHalf); const termB = getTerm(dB, dA, genB, isHalf);
                    if (diff === 0) {
                        if (isHalf) {
                            if (genA === 'm' && genB === 'm') return { main: "Halbbrüder", sub: "Selbe Generation (1 gemeinsamer Elternteil)", roleBtoA };
                            if (genA === 'w' && genB === 'w') return { main: "Halbschwestern", sub: "Selbe Generation (1 gemeinsamer Elternteil)", roleBtoA };
                            return { main: `${termA} & ${termB}`, sub: "Selbe Generation (1 gemeinsamer Elternteil)", roleBtoA };
                        }
                        if (genA === 'm' && genB === 'm') return { main: "Brüder", sub: "Selbe Generation", roleBtoA };
                        if (genA === 'w' && genB === 'w') return { main: "Schwestern", sub: "Selbe Generation", roleBtoA };
                        return { main: `${termA} & ${termB}`, sub: "Selbe Generation", roleBtoA };
                    } else {
                        const subText = diff === 1 ? "um 1 Generation verschoben" : `um ${diff} Generationen verschoben`;
                        return dA < dB
                            ? { main: `${termA} & ${termB}`, sub: subText, roleBtoA }
                            : { main: `${termB} & ${termA}`, sub: subText, roleBtoA };
                    }
                }

                if (minDist >= 2) {
                    const degree = minDist - 1; let mainText = "";
                    if (genA === 'm' && genB === 'm') mainText = `Cousins ${degree}. Grades`;
                    else if (genA === 'w' && genB === 'w') mainText = `Cousinen ${degree}. Grades`;
                    else if ((genA === 'm' && genB === 'w') || (genA === 'w' && genB === 'm')) mainText = `Cousin & Cousine ${degree}. Grades`;
                    else mainText = `Cousins/Cousinen ${degree}. Grades`;

                    // Natürlichen deutschen Satz für verschobene Generationen bilden
                    let roleSentenceSuffix = null;
                    const nameA = pathA.length > 0 ? familyMap[pathA[0]]?.Name : null;
                    if (diff > 0 && nameA) {
                        const withArticle = (g, text) => g === 'm' ? `der ${text}` : g === 'w' ? `die ${text}` : text;
                        if (dB < dA && pathA.length > diff) {
                            const anchor = familyMap[pathA[diff]];
                            if (anchor) {
                                const ancTerm = getTerm(0, diff, anchor.Geschlecht);
                                const bRole = genB === 'm' ? `Cousin ${degree}. Grades` : genB === 'w' ? `Cousine ${degree}. Grades` : `Cousin/e ${degree}. Grades`;
                                roleSentenceSuffix = `ist ${withArticle(genB, bRole)} von ${toGenitiv(nameA)} ${ancTerm} ${anchor.Name}`;
                            }
                        } else if (dA < dB && pathB.length > diff) {
                            const anchor = familyMap[pathB[diff]];
                            if (anchor) {
                                const descTerm = getTerm(diff, 0, genB);
                                const anchorCousin = anchor.Geschlecht === 'm' ? `Cousin ${degree}. Grades` : anchor.Geschlecht === 'w' ? `Cousine ${degree}. Grades` : `Cousin/e ${degree}. Grades`;
                                roleSentenceSuffix = `ist ${withArticle(genB, descTerm)} von ${toGenitiv(nameA)} ${anchorCousin} ${anchor.Name}`;
                            }
                        }
                    }

                    return {
                        main: diff === 0 ? mainText : `${mainText} (${diff}× versetzt)`,
                        sub: diff === 0
                            ? "Selbe Generation"
                            : `${diff} Generation${diff > 1 ? 'en' : ''} Unterschied`,
                        roleBtoA,
                        roleSentenceSuffix
                    };
                }
            };

            const getAllAncestorPaths = (startId) => {
                const results = [];
                const dfs = (currId, path, visited) => {
                    results.push(path);
                    if (path.length > 16) return;
                    const p = familyMap[currId];
                    if (!p) return;
                    [p.Vater_ID, p.Mutter_ID].forEach(pid => {
                        if (pid && familyMap[pid] && !visited.has(pid)) {
                            const nextVisited = new Set(visited);
                            nextVisited.add(pid);
                            dfs(pid, [...path, pid], nextVisited);
                        }
                    });
                };
                dfs(startId, [startId], new Set([startId]));
                return results;
            };

            const findAllBloodConnections = (idA, idB) => {
                if (!idA || !idB || !familyMap[idA] || !familyMap[idB]) return [];
                const genA = familyMap[idA].Geschlecht;
                const genB = familyMap[idB].Geschlecht;

                if (idA === idB) {
                    return [{
                        lca: familyMap[idA],
                        lcaPartner: null,
                        pathA: [idA],
                        pathB: [idB],
                        dA: 0,
                        dB: 0,
                        sum: 0,
                        relationObj: getRelationText(0, 0, genA, genB),
                        branchLabel: "Identisch"
                    }];
                }

                const pathsA = getAllAncestorPaths(idA);
                const pathsB = getAllAncestorPaths(idB);
                const rawConnections = [];

                for (const pA of pathsA) {
                    const lcaId = pA[pA.length - 1];
                    const setA = new Set(pA.slice(0, -1));
                    for (const pB of pathsB) {
                        if (pB[pB.length - 1] !== lcaId) continue;
                        let disjoint = true;
                        for (let k = 0; k < pB.length - 1; k++) {
                            if (setA.has(pB[k])) { disjoint = false; break; }
                        }
                        if (!disjoint) continue;
                        rawConnections.push({
                            lcaId,
                            pathA: pA,
                            pathB: pB,
                            dA: pA.length - 1,
                            dB: pB.length - 1,
                            sum: (pA.length - 1) + (pB.length - 1)
                        });
                    }
                }

                const byBranchPair = new Map();
                for (const conn of rawConnections) {
                    const branchKey = (conn.dA > 0 && conn.dB > 0)
                        ? conn.pathA.slice(0, -1).join(',') + '|' + conn.pathB.slice(0, -1).join(',')
                        : conn.pathA.join(',') + '|' + conn.pathB.join(',');

                    if (!byBranchPair.has(branchKey)) {
                        byBranchPair.set(branchKey, { ...conn, lcaPartnerId: null });
                    } else {
                        const existing = byBranchPair.get(branchKey);
                        if (existing.lcaId !== conn.lcaId) {
                            existing.lcaPartnerId = conn.lcaId;
                        }
                    }
                }

                const sorted = Array.from(byBranchPair.values()).sort((a, b) => a.sum - b.sum);

                const uniqueLines = [];
                const seenLineKeys = new Set();
                for (const c of sorted) {
                    const firstStepA = c.pathA[1] || c.pathA[0];
                    const firstStepB = c.pathB[1] || c.pathB[0];
                    const lineKey = `${firstStepA}_${firstStepB}`;
                    if (!seenLineKeys.has(lineKey)) {
                        seenLineKeys.add(lineKey);
                        const childAUnderLca = c.dA > 0 ? c.pathA[c.pathA.length - 2] : null;
                        const childBUnderLca = c.dB > 0 ? c.pathB[c.pathB.length - 2] : null;
                        const sibType = (childAUnderLca && childBUnderLca) ? getSiblingType(childAUnderLca, childBUnderLca) : null;
                        const isHalf = sibType === "half";

                        let lcaPartner = c.lcaPartnerId ? familyMap[c.lcaPartnerId] : null;
                        if (!lcaPartner && (c.dA === 0 || c.dB === 0)) {
                            const nextStep = childAUnderLca || childBUnderLca;
                            lcaPartner = getRelevantPartner(c.lcaId, nextStep);
                        } else if (!lcaPartner && !isHalf && childAUnderLca) {
                            const cand = getRelevantPartner(c.lcaId, childAUnderLca);
                            const childBObj = familyMap[childBUnderLca];
                            if (cand && childBObj && (!childBObj.Mutter_ID || childBObj.Mutter_ID === cand.ID || !childBObj.Vater_ID || childBObj.Vater_ID === cand.ID)) {
                                lcaPartner = cand;
                            }
                        }

                        const personAObj = familyMap[idA];
                        let viaText = `Über ${familyMap[c.lcaId]?.Name}`;
                        if (c.pathA[1] && personAObj) {
                            if (c.pathA[1] === personAObj.Vater_ID) viaText = `Väterlicherseits (über ${familyMap[c.pathA[1]]?.Name})`;
                            else if (c.pathA[1] === personAObj.Mutter_ID) viaText = `Mütterlicherseits (über ${familyMap[c.pathA[1]]?.Name})`;
                        }

                        uniqueLines.push({
                            ...c,
                            lca: familyMap[c.lcaId],
                            lcaPartner,
                            isHalf,
                            viaText,
                            relationObj: getRelationText(c.dA, c.dB, genA, genB, isHalf, c.pathA, c.pathB)
                        });
                    }
                }

                return uniqueLines;
            };

            const findRelationship = (idA, idB, lineIndexOverride = null) => {
                if (!idA || !idB || !familyMap[idA] || !familyMap[idB]) return null;
                const pA = familyMap[idA];
                const pB = familyMap[idB];

                const partnersOfA = pA.Partner_ID ? pA.Partner_ID.split(',').map(s => s.trim()).filter(Boolean) : [];
                const partnersOfB = pB.Partner_ID ? pB.Partner_ID.split(',').map(s => s.trim()).filter(Boolean) : [];
                const arePartners = partnersOfA.includes(String(idB)) || partnersOfB.includes(String(idA));

                const bloodLines = findAllBloodConnections(idA, idB);

                if (arePartners) {
                    if (bloodLines.length > 0) {
                        const primary = bloodLines[0];
                        return {
                            ...primary,
                            allLines: bloodLines,
                            relationObj: {
                                main: "Partner / Verheiratet",
                                sub: `Zudem blutsverwandt: ${primary.relationObj.main} (${primary.relationObj.sub})`,
                                roleBtoA: pB.Geschlecht === 'm' ? "Ehemann / Partner" : pB.Geschlecht === 'w' ? "Ehefrau / Partnerin" : "Partner/in"
                            }
                        };
                    }
                    return {
                        relationObj: {
                            main: "Partner / Verheiratet",
                            sub: "Direkte Partnerschaft / Ehe",
                            roleBtoA: pB.Geschlecht === 'm' ? "Ehemann / Partner" : pB.Geschlecht === 'w' ? "Ehefrau / Partnerin" : "Partner/in"
                        },
                        pathA: [],
                        pathB: [],
                        lca: null,
                        allLines: []
                    };
                }

                if (bloodLines.length > 0) {
                    const useIdx = lineIndexOverride !== null ? lineIndexOverride : selectedLineIdx;
                    const activeIdx = Math.min(useIdx, bloodLines.length - 1);
                    return {
                        ...bloodLines[activeIdx],
                        allLines: bloodLines,
                        activeLineIdx: activeIdx
                    };
                }

                for (const pbId of partnersOfB) {
                    const viaBLines = findAllBloodConnections(idA, pbId);
                    if (viaBLines.length > 0 && familyMap[pbId]) {
                        const primary = viaBLines[0];
                        return {
                            ...primary,
                            allLines: viaBLines,
                            activeLineIdx: 0,
                            viaPartnerInfo: `${pB.Name} ist verheiratet mit ${familyMap[pbId].Name}`,
                            inLawTargetB: pB,
                            relationObj: {
                                main: `Angeheiratet (über ${familyMap[pbId].Name})`,
                                sub: `${pA.Name} & ${familyMap[pbId].Name} sind: ${primary.relationObj.main}`,
                                roleBtoA: `Angeheiratet (Partner/in von ${familyMap[pbId].Name})`
                            }
                        };
                    }
                }

                for (const paId of partnersOfA) {
                    const viaALines = findAllBloodConnections(paId, idB);
                    if (viaALines.length > 0 && familyMap[paId]) {
                        const primary = viaALines[0];
                        return {
                            ...primary,
                            allLines: viaALines,
                            activeLineIdx: 0,
                            viaPartnerInfo: `${pA.Name} ist verheiratet mit ${familyMap[paId].Name}`,
                            inLawTargetA: pA,
                            relationObj: {
                                main: `Angeheiratet (über ${familyMap[paId].Name})`,
                                sub: `${familyMap[paId].Name} & ${pB.Name} sind: ${primary.relationObj.main}`,
                                roleBtoA: `Angeheiratet (über ${familyMap[paId].Name})`
                            }
                        };
                    }
                }

                return null;
            };

            const relationship = (relPersonA && relPersonB) ? findRelationship(relPersonA.ID, relPersonB.ID) : null;

            // Hilfsfunktion: Dezente Geschlechts-Farbgebung im Heritage-Stil
            const getGenderStyle = (gender) => {
                if (gender === 'm') return {
                    dot: 'bg-[#2F6680]',
                    badge: 'bg-[#EEF5F8] text-[#234E63] border-[#C7DCE6]',
                    card: 'bg-white border-stone-200/90 hover:border-[#7BA5BA]',
                    accentBorder: 'border-l-[#2F6680]',
                    label: 'Männlich',
                    short: 'M'
                };
                if (gender === 'w') return {
                    dot: 'bg-[#A64E67]',
                    badge: 'bg-[#FBF1F4] text-[#84374D] border-[#E8CAD3]',
                    card: 'bg-white border-stone-200/90 hover:border-[#CE8E9F]',
                    accentBorder: 'border-l-[#A64E67]',
                    label: 'Weiblich',
                    short: 'W'
                };
                return {
                    dot: 'bg-stone-400',
                    badge: 'bg-stone-100 text-stone-600 border-stone-200',
                    card: 'bg-white border-stone-200/90 hover:border-stone-400',
                    accentBorder: 'border-l-stone-400',
                    label: 'Unbekannt',
                    short: '?'
                };
            };

            // Interaktive Personenkarte für Ahnentafel & Nachkommen-Baum
            const TreeNodeCard = ({ person, isRoot = false, showPartner = true, levelLabel = null }) => {
                if (!person) return null;
                const gStyle = getGenderStyle(person.Geschlecht);
                const partners = showPartner && person.Partner_ID
                    ? person.Partner_ID.split(',').map(id => familyMap[id.trim()]).filter(Boolean)
                    : [];
                const childCount = person.children ? person.children.length : 0;

                return (
                    <div
                        onClick={() => !isRoot && navigateToPersonInTree(person)}
                        title={isRoot ? `${person.Name} (Aktuelle Fokus-Person)` : `Klicken, um zu ${person.Name} zu wechseln`}
                        className={`flex flex-col rounded-2xl overflow-hidden transition-all duration-200 select-none min-w-[155px] md:min-w-[180px] border ${
                            isRoot
                                ? 'bg-[#102B22] text-white border-[#102B22] ring-4 ring-[#B57B24]/30 shadow-xl scale-[1.03] z-20'
                                : `${gStyle.card} shadow-[0_2px_10px_-3px_rgba(23,32,28,0.08)] hover:shadow-md hover:-translate-y-0.5 z-10 cursor-pointer`
                        }`}
                    >
                        {levelLabel && (
                            <div className={`text-[9px] font-bold uppercase tracking-widest px-3 py-1 text-center border-b ${
                                isRoot
                                    ? 'bg-[#B57B24] text-white border-[#B57B24]'
                                    : 'bg-[#FAF8F4] text-stone-500 border-stone-200/70'
                            }`}>
                                {levelLabel}
                            </div>
                        )}
                        <div className="px-3.5 py-2.5 text-center relative">
                            <div className={`text-xs md:text-sm font-bold whitespace-nowrap flex justify-center items-center gap-1.5 ${isRoot ? 'text-white' : 'text-[#15211D]'}`}>
                                <span className={`w-2 h-2 rounded-full shrink-0 ${isRoot ? 'bg-emerald-300' : gStyle.dot}`}></span>
                                <span>{person.Name}</span>
                                <span className={`text-[10px] font-mono font-normal ${isRoot ? 'text-emerald-200/70' : 'text-stone-400'}`}>#{person.ID}</span>
                            </div>

                            <div className={`flex items-center justify-center gap-1.5 mt-1.5 text-[10px] font-semibold ${isRoot ? 'text-emerald-100/80' : 'text-stone-500'}`}>
                                {childCount > 0 && (
                                    <span className={`px-2 py-0.5 rounded-full border ${
                                        isRoot
                                            ? 'bg-white/10 border-white/15 text-white'
                                            : 'bg-[#F6F3EC] border-stone-200/80 text-stone-700'
                                    }`}>
                                        {childCount} {childCount === 1 ? 'Kind' : 'Kinder'}
                                    </span>
                                )}
                                {person.Generation && (
                                    <span className={`font-mono text-[9px] ${isRoot ? 'text-emerald-200/70' : 'text-stone-400'}`}>Gen. {person.Generation}</span>
                                )}
                            </div>
                        </div>

                        {partners.length > 0 && (
                            <div
                                onClick={(e) => {
                                    e.stopPropagation();
                                    navigateToPersonInTree(partners[0]);
                                }}
                                title={`Zu Partner/in ${partners[0].Name} wechseln`}
                                className={`px-3 py-1.5 border-t text-[10px] md:text-xs font-medium whitespace-nowrap text-center cursor-pointer transition-colors ${
                                    isRoot
                                        ? 'bg-black/20 hover:bg-black/35 border-white/10 text-amber-200'
                                        : 'bg-[#FAF8F4] hover:bg-[#F1ECE1] border-stone-200/70 text-stone-600 hover:text-[#1B4D3E]'
                                }`}
                            >
                                ♥ <span className="font-semibold">{partners.map(p => p.Name).join(', ')}</span>
                            </div>
                        )}
                    </div>
                );
            };

            const BranchChildrenList = ({ items, renderItem }) => {
                if (!items || items.length === 0) return null;
                if (items.length === 1) {
                    return (
                        <div className="flex items-center">
                            <div className="w-7 md:w-10 h-[2px] bg-[#CBBFA8]"></div>
                            {renderItem(items[0], 0)}
                        </div>
                    );
                }

                return (
                    <div className="flex items-center">
                        <div className="w-7 md:w-10 h-[2px] bg-[#CBBFA8]"></div>
                        <div className="flex flex-col justify-center">
                            {items.map((item, idx) => {
                                const isFirst = idx === 0;
                                const isLast = idx === items.length - 1;
                                return (
                                    <div key={item.ID || idx} className="flex items-center relative py-2.5 md:py-3">
                                        <div
                                            className={`w-[2px] bg-[#CBBFA8] absolute left-0 ${
                                                isFirst ? 'top-1/2 bottom-0' : isLast ? 'top-0 bottom-1/2' : 'top-0 bottom-0'
                                            }`}
                                        ></div>
                                        <div className="w-7 md:w-10 h-[2px] bg-[#CBBFA8]"></div>
                                        {renderItem(item, idx)}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const getAncestorLevelLabel = (depth) => {
                if (depth === 0) return "Fokusperson";
                if (depth === 1) return "Eltern (1. Gen.)";
                if (depth === 2) return "Großeltern (2. Gen.)";
                if (depth === 3) return "Urgroßeltern (3. Gen.)";
                if (depth === 4) return "Ur-Urgroßeltern (4. Gen.)";
                return `${depth - 2}x Ur-Großeltern (${depth}. Gen.)`;
            };

            const getDescendantLevelLabel = (depth) => {
                if (depth === 0) return "Fokusperson";
                if (depth === 1) return "Kinder (1. Gen.)";
                if (depth === 2) return "Enkelkinder (2. Gen.)";
                if (depth === 3) return "Urenkel (3. Gen.)";
                return `${depth - 2}x Urenkel (${depth}. Gen.)`;
            };

            const AncestorTree = ({ personId, visited = new Set(), isRoot = false, depth = 0 }) => {
                if (!personId || !familyMap[personId]) return null;
                if (visited.has(personId)) return <div className="text-[10px] text-red-700 bg-red-50 px-2 py-1 rounded border border-red-200">Zirkelbezug</div>;
                const person = familyMap[personId];
                const newVisited = new Set(visited).add(personId);
                const parents = [
                    person.Vater_ID ? familyMap[person.Vater_ID] : null,
                    person.Mutter_ID ? familyMap[person.Mutter_ID] : null
                ].filter(Boolean);

                return (
                    <div className="flex items-center">
                        <TreeNodeCard person={person} isRoot={isRoot} showPartner={false} levelLabel={getAncestorLevelLabel(depth)} />
                        <BranchChildrenList
                            items={parents}
                            renderItem={(parent) => (
                                <AncestorTree personId={parent.ID} visited={newVisited} depth={depth + 1} />
                            )}
                        />
                    </div>
                );
            };

            const DescendantTree = ({ personId, visited = new Set(), isRoot = false, depth = 0 }) => {
                if (!personId || !familyMap[personId]) return null;
                if (visited.has(personId)) return <div className="text-[10px] text-red-700 bg-red-50 px-2 py-1 rounded border border-red-200">Zirkelbezug</div>;
                const person = familyMap[personId];
                const newVisited = new Set(visited).add(personId);
                const childrenObjs = (person.children || []).map(cId => familyMap[cId]).filter(Boolean);

                return (
                    <div className="flex items-center">
                        <TreeNodeCard person={person} isRoot={isRoot} showPartner={true} levelLabel={getDescendantLevelLabel(depth)} />
                        <BranchChildrenList
                            items={childrenObjs}
                            renderItem={(child) => (
                                <DescendantTree personId={child.ID} visited={newVisited} depth={depth + 1} />
                            )}
                        />
                    </div>
                );
            };

            const stats = useMemo(() => {
                const persons = Object.values(familyMap);
                if (persons.length === 0) return null;

                const total = persons.length;
                const male = persons.filter(p => p.Geschlecht === 'm').length;
                const female = persons.filter(p => p.Geschlecht === 'w').length;

                const familyUnits = {};
                persons.forEach(child => {
                    const vId = child.Vater_ID || ""; const mId = child.Mutter_ID || "";
                    if (!vId && !mId) return;
                    const key = `${vId}_${mId}`;
                    if (!familyUnits[key]) familyUnits[key] = { vaterId: vId, mutterId: mId, childrenCount: 0 };
                    familyUnits[key].childrenCount++;
                });
                const topParents = Object.values(familyUnits).sort((a, b) => b.childrenCount - a.childrenCount).slice(0, 6);

                const nameMap = {};
                persons.forEach(p => {
                    const firstName = p.Name.split(' ')[0].trim();
                    if (firstName.length > 2) {
                        if (!nameMap[firstName]) nameMap[firstName] = [];
                        nameMap[firstName].push(p);
                    }
                });
                const topNames = Object.entries(nameMap)
                    .map(([name, list]) => [name, list.length, list])
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 6);

                let maxDepth = 0;
