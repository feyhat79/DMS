                const getDepth = (id, visited = new Set()) => {
                    if (visited.has(id)) return 1; visited.add(id);
                    const p = familyMap[id]; if (!p || p.children.length === 0) return 1;
                    let childMax = 0;
                    for (let cid of p.children) childMax = Math.max(childMax, getDepth(cid, new Set(visited)));
                    return 1 + childMax;
                };
                const roots = persons.filter(p => !p.Vater_ID && !p.Mutter_ID);
                roots.forEach(r => maxDepth = Math.max(maxDepth, getDepth(r.ID)));

                const genMap = {};
                persons.forEach(p => {
                    const g = p.Generation ? String(p.Generation).trim() : "";
                    if (g) genMap[g] = (genMap[g] || 0) + 1;
                });
                const generationDistribution = Object.entries(genMap).sort((a, b) => {
                    const na = parseInt(a[0], 10);
                    const nb = parseInt(b[0], 10);
                    if (!isNaN(na) && !isNaN(nb)) return na - nb;
                    return a[0].localeCompare(b[0]);
                });
                const maxGenCount = generationDistribution.reduce((m, [, c]) => Math.max(m, c), 1);

                return {
                    total,
                    male,
                    female,
                    topParents,
                    topNames,
                    maxDepth,
                    withPartner: persons.filter(p => p.Partner_ID).length,
                    rootCount: roots.length,
                    generationDistribution,
                    maxGenCount
                };
            }, [familyMap]);

            // 1. SPERRBILDSCHIRM (Evergreen Heritage Vault)
            if (!isUnlocked) {
                return (
                    <div className="min-h-[100dvh] flex items-center justify-center p-4 vault-bg">
                        <div className={`w-full max-w-md bg-[#FAF8F4] rounded-[28px] shadow-[0_25px_70px_-15px_rgba(0,0,0,0.55)] p-7 md:p-10 border border-white/25 animate-fade-in ${authError ? 'animate-shake' : ''}`}>
                            <div className="w-16 h-16 bg-[#102B22] text-[#D49B38] rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg border border-[#1B4D3E]">
                                <Icon name="TreeCrest" size={32} />
                            </div>

                            <div className="text-center mb-7">
                                <span className="inline-flex items-center gap-1.5 px-3 py-1 bg-[#EDF5F1] text-[#1B4D3E] font-bold uppercase text-[10px] tracking-widest rounded-full mb-3 border border-[#CDE2D8]">
                                    <Icon name="Lock" size={11} />
                                    AES-256 Familienarchiv
                                </span>
                                <h1 className="font-serif text-3xl md:text-4xl font-bold text-[#15211D] tracking-tight">
                                    Dara mala Safe
                                </h1>
                                <p className="text-xs md:text-sm text-stone-600 mt-2 leading-relaxed">
                                    Privater Familienbereich. Bitte gib das Familien-Passwort ein, um den Stammbaum lokal im Browser zu entschlüsseln.
                                </p>
                            </div>

                            <form onSubmit={handleLoginSubmit} className="space-y-4">
                                <div>
                                    <label className="text-[11px] font-bold text-stone-500 uppercase tracking-wider ml-1 mb-1.5 block">
                                        Familien-Passwort
                                    </label>
                                    <div className="relative">
                                        <input
                                            type={showPassword ? "text" : "password"}
                                            value={passwordInput}
                                            onChange={(e) => { setPasswordInput(e.target.value); setAuthError(""); }}
                                            placeholder="Passwort eingeben..."
                                            autoFocus
                                            className="w-full py-3.5 pl-11 pr-12 bg-white rounded-2xl outline-none text-sm font-medium border border-stone-200 focus:ring-2 focus:ring-[#1B4D3E]/20 focus:border-[#1B4D3E] transition-all shadow-xs"
                                        />
                                        <Icon name="KeyRound" size={17} className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none" />
                                        <button
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute right-3.5 top-1/2 -translate-y-1/2 p-1.5 text-stone-400 hover:text-stone-700 rounded-lg transition-colors"
                                            title={showPassword ? "Passwort verbergen" : "Passwort anzeigen"}
                                        >
                                            <Icon name={showPassword ? "EyeOff" : "Eye"} size={18} />
                                        </button>
                                    </div>
                                </div>

                                {authError && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs font-bold flex items-center gap-2">
                                        <Icon name="AlertCircle" size={16} className="text-red-500" />
                                        <span>{authError}</span>
                                    </div>
                                )}

                                <label className="flex items-center gap-2.5 cursor-pointer select-none text-xs text-stone-600 font-medium ml-1">
                                    <input
                                        type="checkbox"
                                        checked={rememberMe}
                                        onChange={(e) => setRememberMe(e.target.checked)}
                                        className="w-4 h-4 rounded border-stone-300 text-[#1B4D3E] focus:ring-[#1B4D3E]"
                                    />
                                    Auf diesem Gerät merken
                                </label>

                                <button
                                    type="submit"
                                    disabled={!passwordInput.trim() || isDecrypting}
                                    className="w-full bg-[#102B22] hover:bg-[#1B4D3E] disabled:opacity-50 text-white font-bold py-4 rounded-2xl shadow-lg shadow-[#102B22]/20 transition-all active:scale-[0.99] flex items-center justify-center gap-2.5"
                                >
                                    {isDecrypting ? (
                                        <>
                                            <Icon name="Loader2" size={20} className="animate-spin" />
                                            <span>Entschlüssele Archiv...</span>
                                        </>
                                    ) : (
                                        <>
                                            <Icon name="Unlock" size={18} />
                                            <span>Entsperren &amp; Öffnen</span>
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const globalSearchResults = searchPeople(globalSearchQuery);

            // 2. HAUPT-DASHBOARD
            return (
                <div className="min-h-[100dvh] flex flex-col relative heritage-canvas">

                    {/* WELCOME / INFO MODAL */}
                    {showModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-6">
                            <div className="absolute inset-0 bg-[#0B1B15]/70 backdrop-blur-sm transition-opacity" onClick={() => setShowModal(false)}></div>

                            <div className="relative bg-[#FAF8F4] w-full max-w-lg rounded-[28px] shadow-2xl p-6 md:p-9 animate-fade-in text-center border border-stone-200">
                                <div className="w-14 h-14 bg-[#102B22] text-[#D49B38] rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-md">
                                    <Icon name="TreeCrest" size={28} />
                                </div>

                                <span className="inline-block px-3 py-0.5 bg-[#FBF5E8] text-[#9A6416] border border-[#EBD8B0] rounded-full text-[10px] font-bold uppercase tracking-widest mb-2">
                                    Familienchronik
                                </span>
                                <h2 className="font-serif text-2xl md:text-3xl font-bold text-[#15211D] mb-4 tracking-tight">
                                    Willkommen beim Safe-Stammbaum
                                </h2>

                                <div className="text-stone-600 text-sm leading-relaxed space-y-3.5 mb-6 text-left bg-white p-5 rounded-2xl border border-stone-200/80 max-h-[42vh] overflow-y-auto custom-scrollbar">
                                    <p>
                                        Schön, dass du hier bist! Ich habe die Daten aus dem Bild von <strong>Şikri (Dara mala Safe)</strong> in eine Datenbank übertragen und diesen Verwandtschaftsrechner erstellt.
                                    </p>
                                    <p>
                                        Entschuldigt bitte, dass die Daten noch viele Fehler enthalten (insbesondere die richtige Schreibweise der Namen). Ich kenne zum Beispiel nicht die Namen aller angeheirateten Mädels von uns, und auch viele Querverweise fehlen noch. Vielleicht mache ich ja irgendwann mal ein Update :).
                                    </p>
                                    <div className="bg-red-50/80 border-l-4 border-red-500 p-3.5 rounded-r-xl mt-3">
                                        <p className="text-red-900 text-xs md:text-sm font-bold">
                                            Wichtiger Hinweis zur Privatsphäre:
                                        </p>
                                        <p className="text-red-800 text-xs md:text-sm mt-1">
                                            Diese Datenbank und der dazugehörige Link sind <strong>rein privat</strong> und ausschließlich für unseren Familienkreis bestimmt. Unbefugten ist die Einsicht sowie das Teilen des Links ausdrücklich nicht gestattet. Bitte geht absolut vertraulich mit diesen Informationen um.
                                        </p>
                                    </div>
                                    <p className="pt-1 font-serif italic text-[#1B4D3E] font-semibold">Silave ib girez, Feyhat</p>
                                </div>

                                <button
                                    onClick={() => setShowModal(false)}
                                    className="w-full bg-[#102B22] hover:bg-[#1B4D3E] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-[#102B22]/15 transition-all active:scale-[0.99] flex items-center justify-center gap-2.5 group"
                                >
                                    <span>Verstanden &amp; Eintreten</span>
                                    <Icon name="ArrowRight" size={18} className="group-hover:translate-x-1 transition-transform" />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* EINZIGE, KLARE TOP-NAVIGATION */}
                    <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-stone-200/80 px-3 sm:px-6 h-16 flex justify-between items-center gap-3 shrink-0">
                        {/* Marke */}
                        <div className="flex items-center gap-2.5 min-w-0">
                            <button
                                onClick={() => setActiveTab('calculator')}
                                className="w-9 h-9 md:w-10 md:h-10 bg-[#102B22] rounded-xl flex items-center justify-center text-[#D49B38] shadow-sm shrink-0 hover:bg-[#1B4D3E] transition-colors"
                                title="Zur Startseite"
                            >
                                <Icon name="TreeCrest" size={20} />
                            </button>
                            <div className="min-w-0">
                                <h1 className="font-serif text-base md:text-lg font-bold text-[#15211D] leading-tight truncate">Safe-Stammbaum</h1>
                                <p className="text-[10px] md:text-[11px] text-stone-500 font-medium truncate">
                                    {Object.keys(familyMap).length} Personen • Dara mala Safe
                                </p>
                            </div>
                        </div>

                        {/* Primäre Navigation (Desktop) */}
                        <nav className="hidden lg:flex items-center bg-[#F2EFE8] p-1 rounded-2xl border border-stone-200/70">
                            <button
                                onClick={() => setActiveTab('calculator')}
                                className={`px-4 py-1.5 text-xs font-bold rounded-xl transition-all flex items-center gap-2 ${
                                    activeTab === 'calculator'
                                        ? 'bg-white shadow-sm text-[#5B3E8C]'
                                        : 'text-stone-600 hover:text-[#15211D]'
                                }`}
                            >
                                <Icon name="GitMerge" size={15} />
                                <span>Rechner</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('tree')}
                                className={`px-4 py-1.5 text-xs font-bold rounded-xl transition-all flex items-center gap-2 ${
                                    activeTab === 'tree'
                                        ? 'bg-white shadow-sm text-[#1B4D3E]'
                                        : 'text-stone-600 hover:text-[#15211D]'
                                }`}
                            >
                                <Icon name="Compass" size={15} />
                                <span>Familien-Atlas</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('stats')}
                                className={`px-4 py-1.5 text-xs font-bold rounded-xl transition-all flex items-center gap-2 ${
                                    activeTab === 'stats'
                                        ? 'bg-white shadow-sm text-[#2F6680]'
                                        : 'text-stone-600 hover:text-[#15211D]'
                                }`}
                            >
                                <Icon name="BarChart3" size={15} />
                                <span>Statistik</span>
                            </button>
                        </nav>

                        {/* Rechte Aktionsleiste: Globale Schnellsuche + Mein Profil + Info + Sperren */}
                        <div className="flex items-center gap-1.5 md:gap-2 shrink-0">
                            {/* Globale Schnellsuche (Desktop/Tablet) */}
                            <div className="relative hidden sm:block w-44 md:w-60">
                                <input
                                    ref={globalSearchRef}
                                    value={globalSearchQuery}
                                    onFocus={() => setGlobalSearchFocused(true)}
                                    onBlur={() => setTimeout(() => setGlobalSearchFocused(false), 180)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' && globalSearchResults.length > 0) {
                                            navigateToPersonInTree(globalSearchResults[0], 'satellite');
                                        }
                                    }}
                                    onChange={(e) => { setGlobalSearchQuery(e.target.value); setGlobalSearchFocused(true); }}
                                    placeholder="Person öffnen... (/)"
                                    className="w-full py-2 pl-9 pr-8 bg-[#F6F3EC] focus:bg-white rounded-xl outline-none text-xs font-medium border border-stone-200/90 focus:border-[#1B4D3E] focus:ring-2 focus:ring-[#1B4D3E]/15 transition-all"
                                />
                                <Icon name="Search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none" />
                                {globalSearchQuery && (
                                    <button
                                        onClick={() => setGlobalSearchQuery("")}
                                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-700"
                                    >
                                        <Icon name="X" size={13} />
                                    </button>
                                )}

                                {globalSearchFocused && globalSearchQuery.trim() && (
                                    <div className="absolute right-0 w-72 md:w-80 mt-2 bg-white border border-stone-200 rounded-2xl shadow-xl max-h-80 overflow-y-auto custom-scrollbar z-50">
                                        <div className="px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-stone-400 border-b border-stone-100 bg-[#FAF8F4]">
                                            Direktsprung in den Familien-Atlas
                                        </div>
                                        {globalSearchResults.length === 0 ? (
                                            <div className="p-4 text-center text-xs text-stone-400">
                                                Keine Person mit „{globalSearchQuery}“ gefunden.
                                            </div>
                                        ) : (
                                            globalSearchResults.map(p => {
                                                const gs = getGenderStyle(p.Geschlecht);
                                                return (
                                                    <button
                                                        key={p.ID}
                                                        onMouseDown={(e) => {
                                                            e.preventDefault();
                                                            navigateToPersonInTree(p, 'satellite');
                                                        }}
                                                        className="w-full px-3.5 py-2.5 text-left hover:bg-[#EDF5F1] border-b border-stone-100 last:border-b-0 transition-colors"
                                                    >
                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="font-bold text-xs text-[#15211D] flex items-center gap-1.5 truncate">
                                                                <span className={`w-2 h-2 rounded-full shrink-0 ${gs.dot}`}></span>
                                                                <span className="truncate">{p.Name}</span>
                                                            </div>
                                                            <span className="text-[10px] font-mono text-stone-400 shrink-0">#{p.ID}</span>
                                                        </div>
                                                        <div className="text-[11px] text-stone-500 truncate mt-0.5 pl-3.5">{getPersonContext(p)}</div>
                                                    </button>
                                                );
                                            })
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Info-Hinweis Button */}
                            <button

                                                                <div className="text-[9px] font-bold text-stone-400 uppercase mt-0.5">Kinder</div>
                                                            </div>
                                                            <Icon name="ChevronRight" size={16} className="text-stone-300 group-hover:text-[#1B4D3E] transition-transform group-hover:translate-x-0.5" />
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 md:p-7 rounded-3xl border border-stone-200/80 shadow-[0_4px_20px_-8px_rgba(23,32,28,0.06)]">
                                        <div className="flex justify-between items-center mb-5">
                                            <h3 className="font-serif text-base md:text-lg font-bold text-[#15211D]">Häufigste Vornamen</h3>
                                            <span className="text-[10px] font-bold text-[#5B3E8C] bg-[#F5F2FB] px-2.5 py-1 rounded-full border border-[#E1D8F2]">
                                                Klick → Personenliste
                                            </span>
                                        </div>
                                        <div className="space-y-2.5">
                                            {stats.topNames.map(([name, count, personList], idx) => {
                                                const isExpanded = expandedName === name;
                                                return (
                                                    <div key={name} className="rounded-2xl border border-stone-200/70 overflow-hidden bg-[#FAF8F4]">
                                                        <button
                                                            onClick={() => setExpandedName(isExpanded ? null : name)}
                                                            className="w-full relative p-3.5 text-left overflow-hidden z-10 hover:bg-[#F5F2FB]/60 transition-colors"
                                                        >
                                                            <div
                                                                className="absolute left-0 top-0 bottom-0 bg-[#E8E2F4]/70 -z-10 transition-all"
                                                                style={{ width: `${(count/stats.topNames[0][1])*100}%` }}
                                                            ></div>
                                                            <div className="flex justify-between items-center">
                                                                <div className="flex items-center gap-3">
                                                                    <div className="text-sm font-mono font-bold text-stone-400 w-6">#{idx+1}</div>
                                                                    <div className="font-bold text-xs md:text-sm text-[#15211D]">{name}</div>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="font-serif text-base md:text-lg font-bold text-[#5B3E8C]">{count}×</span>
                                                                    <Icon name={isExpanded ? "ChevronDown" : "ChevronRight"} size={15} className="text-stone-400" />
                                                                </div>
                                                            </div>
                                                        </button>

                                                        {isExpanded && (
                                                            <div className="bg-white border-t border-stone-100 divide-y divide-stone-50 px-3 py-2 space-y-1 animate-fade-in max-h-64 overflow-y-auto custom-scrollbar">
                                                                {personList.map(p => (
                                                                    <button
                                                                        key={p.ID}
                                                                        onClick={() => navigateToPersonInTree(p, 'satellite')}
                                                                        className="w-full p-2 rounded-xl hover:bg-[#EDF5F1] text-left flex justify-between items-center transition-colors group"
                                                                    >
                                                                        <div className="min-w-0 pr-2">
                                                                            <div className="text-xs font-bold text-[#15211D] group-hover:text-[#102B22] truncate">
                                                                                {p.Name} <span className="text-[10px] font-mono text-stone-400">#{p.ID}</span>
                                                                            </div>
                                                                            <div className="text-[10px] text-stone-500 truncate">{getPersonContext(p)}</div>
                                                                        </div>
                                                                        <span className="text-[10px] font-bold text-[#1B4D3E] opacity-0 group-hover:opacity-100 flex items-center gap-1 shrink-0">
                                                                            Steckbrief <Icon name="ArrowRight" size={12} />
                                                                        </span>
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MOBILE BOTTOM NAVIGATION */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-stone-200 z-50 pb-safe shadow-[0_-4px_16px_-4px_rgba(0,0,0,0.08)]">
                        <div className="flex justify-around items-center p-1.5">
                            <button onClick={() => setActiveTab('calculator')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all flex-1 ${activeTab === 'calculator' ? 'text-[#5B3E8C] bg-[#F5F2FB]' : 'text-stone-400'}`}>
                                <Icon name="GitMerge" size={19} />
                                <span className="text-[10px] font-bold">Rechner</span>
                            </button>
                            <button onClick={() => setActiveTab('tree')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all flex-1 ${activeTab === 'tree' ? 'text-[#1B4D3E] bg-[#EDF5F1]' : 'text-stone-400'}`}>
                                <Icon name="Compass" size={19} />
                                <span className="text-[10px] font-bold">Familien-Atlas</span>
                            </button>
                            <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all flex-1 ${activeTab === 'stats' ? 'text-[#2F6680] bg-[#EEF5F8]' : 'text-stone-400'}`}>
                                <Icon name="BarChart3" size={19} />
                                <span className="text-[10px] font-bold">Statistik</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
